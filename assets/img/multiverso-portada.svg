<path d="M0 540 150 405 250 475 390 340 500 470 650 365 790 490 950 335 1090 475 1240 350 1380 465 1510 385 1600 455V700H0Z" fill="#6e9ab0" opacity=".9"/>
<path d="m150 405 55 60 45 10-55-2-45-34-35 45zM390 340l66 83 45 47-58-26-53-58-42 40zM950 335l70 85 70 55-77-32-65-65-48 43zM1240 350l65 70 75 45-76-25-64-52-38 34z" fill="#e8edf0" opacity=".9"/>
