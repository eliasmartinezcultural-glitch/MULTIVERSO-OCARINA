<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Terruño patagónico conectado</title><desc id="desc">Chacras, río, álamos y montañas bajo un cielo azul con un satélite y líneas de conexión.</desc>
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#0d4774"/><stop offset=".48" stop-color="#4e9bc0"/><stop offset="1" stop-color="#e5d9b9"/></linearGradient>
 <linearGradient id="sunset" x2="0" y2="1"><stop stop-color="#fff4cf" stop-opacity=".95"/><stop offset="1" stop-color="#f3d49a" stop-opacity="0"/></linearGradient>
 <linearGradient id="river" x2="1" y2="1"><stop stop-color="#a7d8e4"/><stop offset=".55" stop-color="#4c9ab7"/><stop offset="1" stop-color="#246b91"/></linearGradient>
 <linearGradient id="field" x2="0" y2="1"><stop stop-color="#9caf7e"/><stop offset="1" stop-color="#526e55"/></linearGradient>
 <linearGradient id="bluefield" x2="0" y2="1"><stop stop-color="#658d83"/><stop offset="1" stop-color="#345f62"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="8"/></filter>
 <pattern id="rows" width="34" height="34" patternUnits="userSpaceOnUse" patternTransform="rotate(-14)"><path d="M0 0V34" stroke="#e5d8ad" stroke-opacity=".25" stroke-width="5"/></pattern>
</defs>
<rect width="1600" height="900" fill="url(#sky)"/>
<circle cx="360" cy="390" r="220" fill="url(#sunset)"/><circle cx="360" cy="390" r="72" fill="#ffe9b5" opacity=".88"/>
<g fill="none" stroke="#b9e5f4" stroke-opacity=".38"><path d="M-30 210Q390 -70 830 120T1640 105"/><path d="M-20 270Q410 20 840 200T1640 175"/><path d="M60 0Q520 250 1040 20T1600 85" stroke-dasharray="5 13"/></g>
<g fill="#d9eff4" opacity=".75"><circle cx="210" cy="145" r="3"/><circle cx="570" cy="92" r="4"/><circle cx="920" cy="175" r="3"/><circle cx="1240" cy="94" r="4"/><circle cx="1450" cy="260" r="3"/></g>
