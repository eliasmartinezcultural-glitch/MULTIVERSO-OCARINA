name: Calidad del portal

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    name: Auditoría estática del portal
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Comprobar sintaxis JavaScript
        shell: bash
        run: |
          set -euo pipefail
          for file in assets/js/*.js; do
            echo "Revisando $file"
            node --check "$file"
          done
      - name: Verificar integridad del catálogo de mundos
        run: |
          node -e 'global.window = {}; require("./assets/js/proyectos.js"); const expected = ["LIBRITO","OCARINA TV","OCARINA WILD","¿SABÍAS QUE?","CHAÑAR HUB","CÓDIGO CERO","YOUTUBE","RADIO ONLINE","OCARINA SOCIAL"]; const actual = window.OCARINA_PROJECTS.map(item => item.name); if (JSON.stringify(actual) !== JSON.stringify(expected)) { console.error("Catálogo inválido:", actual); process.exit(1); } console.log("OK: nueve mundos, orden e identidad preservados.");'
      - name: Auditar HTML, recursos CSS y navegación
        run: python3 scripts/auditoria_estatica.py
